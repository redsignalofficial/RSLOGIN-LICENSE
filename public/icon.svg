<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="70%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>
    <linearGradient id="iconCubeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="iconCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="iconCubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="iconCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E" />
      <stop offset="50%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="iconBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00F7FF" />
      <stop offset="70%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="iconBoltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0077FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="iconNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="iconClipTop">
      <polygon points="200,52 340,131 200,210 60,131" />
    </clipPath>
    <clipPath id="iconClipLeft">
      <polygon points="60,131 200,210 200,378 60,299" />
    </clipPath>
    <clipPath id="iconClipRight">
      <polygon points="200,210 340,131 340,299 200,378" />
    </clipPath>
  </defs>

  <!-- Background Shield Box -->
  <rect width="400" height="400" rx="48" fill="url(#iconBgGlow)" />
  <rect width="398" height="398" x="1" y="1" rx="47" fill="none" stroke="url(#iconCubeBevel)" stroke-width="2" opacity="0.6" />

  <g transform="translate(0, -7)">
    <!-- Hexagon Frame -->
    <polygon points="200,30 362,123 362,307 200,400 38,307 38,123" fill="#090E1D" />
    <polygon points="200,30 362,123 362,307 200,400 38,307 38,123" fill="none" stroke="url(#iconCubeBevel)" stroke-width="7" stroke-linejoin="round" />
    <polygon points="200,38 354,127 354,303 200,392 46,303 46,127" fill="none" stroke="#00F7FF" stroke-width="1.5" opacity="0.6" />

    <!-- Isometric Minecraft Cube - TOP FACE -->
    <polygon points="200,52 340,131 200,210 60,131" fill="url(#iconCubeTop)" />
    <g clip-path="url(#iconClipTop)" opacity="0.6" stroke="#00F7FF" stroke-width="1.5">
      <line x1="130" y1="91" x2="270" y2="171" />
      <line x1="95" y1="111" x2="235" y2="191" />
      <line x1="165" y1="71" x2="305" y2="151" />
      <line x1="270" y1="91" x2="130" y2="171" />
      <line x1="235" y1="71" x2="95" y2="151" />
      <line x1="305" y1="111" x2="165" y2="191" />
    </g>

    <!-- Isometric Minecraft Cube - LEFT FACE (Red) -->
    <polygon points="60,131 200,210 200,378 60,299" fill="url(#iconCubeLeft)" />
    <g clip-path="url(#iconClipLeft)" opacity="0.65">
      <path d="M70,160 L140,200 L140,280 L190,310" fill="none" stroke="#FF2D55" stroke-width="2" />
      <path d="M100,250 L160,285 L160,345" fill="none" stroke="#FF2D55" stroke-width="1.5" stroke-dasharray="6,4" />
      <circle cx="140" cy="200" r="3.5" fill="#FF88A3" />
      <circle cx="190" cy="310" r="4" fill="#FFFFFF" />
    </g>

    <!-- Isometric Minecraft Cube - RIGHT FACE (Azure) -->
    <polygon points="200,210 340,131 340,299 200,378" fill="url(#iconCubeRight)" />
    <g clip-path="url(#iconClipRight)" opacity="0.65">
      <path d="M330,160 L260,200 L260,280 L210,310" fill="none" stroke="#00F7FF" stroke-width="2" />
      <path d="M300,250 L240,285 L240,345" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" />
      <circle cx="260" cy="200" r="3.5" fill="#A5F3FC" />
      <circle cx="210" cy="310" r="4" fill="#FFFFFF" />
    </g>

    <!-- Glowing Corner Edges -->
    <path d="M60,131 L200,210 L340,131 M200,210 L200,378" fill="none" stroke="#00F7FF" stroke-width="2.5" opacity="0.8" filter="url(#iconNeon)" />

    <!-- Ambient Lightning Aura -->
    <circle cx="205" cy="210" r="90" fill="url(#iconBoltGlow)" opacity="0.5" />

    <!-- Dynamic Lightning Bolt -->
    <g filter="url(#iconNeon)">
      <polygon points="234,36 274,36 236,162 292,162 144,392 174,244 114,244" fill="url(#iconBoltGrad)" stroke="#00F7FF" stroke-width="3" stroke-linejoin="round" />
    </g>
    <polygon points="242,50 260,50 224,172 266,172 168,328 184,234 136,234" fill="#FFFFFF" opacity="0.9" />

    <!-- Lock Badge -->
    <g transform="translate(254,286)">
      <circle cx="36" cy="36" r="34" fill="#0A1124" stroke="#00F7FF" stroke-width="3" />
      <circle cx="36" cy="36" r="28" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="4,3" />
      <path d="M24,34 V25 A12,12 0 0 1 48,25 V34" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
      <rect x="20" y="33" width="32" height="24" rx="5" fill="#FF2D55" />
      <rect x="20" y="33" width="32" height="4" rx="2" fill="#FFA5B5" opacity="0.6" />
      <circle cx="36" cy="43" r="3.5" fill="#FFFFFF" />
      <polygon points="34.5,43 37.5,43 38.5,50 33.5,50" fill="#FFFFFF" />
    </g>
  </g>
</svg>
